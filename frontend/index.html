<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music For Art - MVP</title>
    <style>
      :root {
        --bg: #f4efe6;
        --ink: #1f1f1f;
        --panel: #fff8ee;
        --accent: #8d2b20;
        --line: #d4c6ad;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Noto Serif SC", "Source Han Serif SC", serif;
        color: var(--ink);
        background: radial-gradient(circle at top, #fffaf3 0%, var(--bg) 65%);
      }
      .wrap { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
      h1 { margin: 0 0 16px; font-size: 28px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
      }
      label { display: block; margin: 8px 0 4px; font-weight: 600; }
      input, textarea, button, select {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        font: inherit;
      }
      button {
        cursor: pointer;
        border: none;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
      }
      pre {
        white-space: pre-wrap;
        line-height: 1.45;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        min-height: 120px;
      }
      .pretty {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        min-height: 220px;
        margin-bottom: 10px;
      }
      .kv {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 6px;
        font-size: 14px;
        margin-bottom: 8px;
      }
      .table-lite {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .table-lite th, .table-lite td {
        border: 1px solid var(--line);
        padding: 6px;
        text-align: left;
      }
      .md h1, .md h2, .md h3 { margin: 8px 0; }
      .md ul { margin: 6px 0 6px 20px; }
      .error {
        border: 1px solid #b3261e;
        background: #ffeceb;
        color: #7b1e1a;
        border-radius: 8px;
        padding: 8px;
        font-size: 14px;
      }
      .review {
        margin-top: 12px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
      }
      .review h4 { margin: 0 0 8px; }
      .review-actions {
        display: flex;
        gap: 8px;
        margin: 8px 0;
      }
      .review-actions button {
        width: auto;
        padding: 6px 10px;
      }
      .review-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .review-table th,
      .review-table td {
        border: 1px solid var(--line);
        padding: 6px;
        text-align: left;
      }
      .hint { font-size: 12px; opacity: 0.8; }
      .busy {
        margin-top: 8px;
        padding: 8px;
        border-radius: 8px;
        border: 1px dashed var(--line);
        background: #fff;
        font-size: 13px;
      }
      @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Audiobook AI Studio · MVP 验证台</h1>
      <div class="grid">
        <section class="card">
          <label>API 地址</label>
          <input id="apiBase" value="http://127.0.0.1:8090/api" />

          <label>项目标题</label>
          <input id="projectTitle" value="玄武战役教学样例" />
          <button onclick="createProject()">1) 创建项目</button>
          <p class="hint">当前项目ID: <span id="projectId">-</span></p>

          <label>报告模式</label>
          <select id="reportMode">
            <option value="production" selected>production（制作版）</option>
            <option value="teaching">teaching（教学版）</option>
            <option value="concise">concise（简版）</option>
          </select>

          <label>上传音乐</label>
          <input id="audioFile" type="file" accept="audio/*" />
          <button onclick="uploadAudio()">2) 音乐分析</button>

          <label>输入文本</label>
          <textarea id="textInput" rows="8" placeholder="输入章节片段，系统会识别动作和音效建议"></textarea>
          <button onclick="analyzeText()">3) 文本分析</button>

          <label>上传演绎音频（可选但推荐）</label>
          <input id="narrationFile" type="file" accept="audio/*" />
          <button onclick="analyzeNarration()">3.5) 演绎音频时间轴</button>

          <button onclick="buildFusion()">4) 生成融合执行单</button>
          <button onclick="fetchReport()">5) 拉取完整报告</button>
          <button onclick="downloadCueCsv()">6) 下载 Cue CSV</button>
          <button onclick="downloadSfxZip()">7) 下载 SFX ZIP</button>

          <label>图谱推理词</label>
          <input id="graphTerm" value="脚步声" />
          <button onclick="graphReason()">8) 图谱推理</button>
          <button onclick="graphStatus()">9) 图谱状态</button>
          <button onclick="graphDashboard()">10) 图谱看板</button>
          <button onclick="opsFunnel()">11) 漏斗指标</button>
          <button onclick="opsRecommend()">12) 优化建议</button>
          <button onclick="opsLexiconDraft()">13) 生成词典草稿</button>
          <button onclick="opsLexiconDraftApplyMerge()">14) 应用词典草稿(merge)</button>
          <button onclick="opsLexiconDraftApplyHighConf()">15) 应用高置信草稿(>=0.45)</button>
          <button onclick="opsLexiconDraftApplyManual()">16) 按勾选候选应用</button>
          <button onclick="markSelectedDraftRejected()">17) 标记勾选为拒绝</button>
          <button onclick="markSelectedDraftApproved()">18) 标记勾选为通过</button>
        </section>

        <section class="card">
          <h3>结果展示（中文）</h3>
          <div id="prettyOutput" class="pretty">等待操作...</div>
          <details>
            <summary>原始响应（调试）</summary>
            <pre id="output">等待操作...</pre>
          </details>
          <div id="busyTip" class="busy" style="display:none;">处理中，请稍候...</div>
          <div class="review" id="draftReview">
            <h4>词典草稿审核区</h4>
            <div class="hint">先点击“13) 生成词典草稿”，再在此勾选候选词应用。</div>
            <div class="review-actions">
              <button onclick="selectAllDraftItems(true)">全选</button>
              <button onclick="selectAllDraftItems(false)">全不选</button>
            </div>
            <div id="draftReviewTable"></div>
          </div>
        </section>
      </div>
    </div>

    <script>
      let projectId = null;
      let latestLexiconDraft = null;
      let uiBusy = false;

      function show(data) {
        document.getElementById('output').textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
        renderPretty(data);
      }

      function mdToHtml(md) {
        const lines = String(md || '').split('\n');
        const out = [];
        let inList = false;
        for (const line of lines) {
          const s = line.trim();
          if (!s) {
            if (inList) { out.push('</ul>'); inList = false; }
            continue;
          }
          if (s.startsWith('### ')) { if (inList) { out.push('</ul>'); inList = false; } out.push(`<h3>${escHtml(s.slice(4))}</h3>`); continue; }
          if (s.startsWith('## ')) { if (inList) { out.push('</ul>'); inList = false; } out.push(`<h2>${escHtml(s.slice(3))}</h2>`); continue; }
          if (s.startsWith('# ')) { if (inList) { out.push('</ul>'); inList = false; } out.push(`<h1>${escHtml(s.slice(2))}</h1>`); continue; }
          if (s.startsWith('- ')) {
            if (!inList) { out.push('<ul>'); inList = true; }
            out.push(`<li>${escHtml(s.slice(2))}</li>`);
            continue;
          }
          if (inList) { out.push('</ul>'); inList = false; }
          out.push(`<p>${escHtml(s)}</p>`);
        }
        if (inList) out.push('</ul>');
        return out.join('');
      }

      function renderPretty(data) {
        const box = document.getElementById('prettyOutput');
        if (typeof data === 'string') {
          box.innerHTML = `<div>${escHtml(data)}</div>`;
          return;
        }
        if (!data || typeof data !== 'object') {
          box.innerHTML = '<div>暂无可展示内容</div>';
          return;
        }
        if (data.detail) {
          const miss = Array.isArray(data.missing) && data.missing.length ? `（缺少：${data.missing.join('、')}）` : '';
          const hint = data.hint ? `<div style="margin-top:6px;">${escHtml(data.hint)}</div>` : '';
          box.innerHTML = `<div class="error">${escHtml(data.detail)}${escHtml(miss)}${hint}</div>`;
          return;
        }
        const blocks = [];
        const fitFromReport = data.report_json && typeof data.report_json === 'object' ? data.report_json.fit_verdict : null;
        if (fitFromReport && typeof fitFromReport === 'object') {
          const score = Number(fitFromReport.score || 0);
          const verdict = fitFromReport.verdict || '未判定';
          const reasons = Array.isArray(fitFromReport.reasons) ? fitFromReport.reasons.map(x => `<li>${escHtml(x)}</li>`).join('') : '';
          blocks.push(`
            <h4>音乐与文本适配结论</h4>
            <div class="kv"><div>结论</div><div><strong>${escHtml(verdict)}</strong></div></div>
            <div class="kv"><div>适配评分</div><div>${score}/100</div></div>
            ${reasons ? `<ul>${reasons}</ul>` : ''}
          `);
        }
        if (data.fit && typeof data.fit === 'object') {
          const score = Number(data.fit.fit_score || 0);
          const verdict = data.fit.verdict || '未判定';
          const reasons = Array.isArray(data.fit.reasons) ? data.fit.reasons.map(x => `<li>${escHtml(x)}</li>`).join('') : '';
          blocks.push(`
            <h4>音乐与文本适配结论</h4>
            <div class="kv"><div>结论</div><div><strong>${escHtml(verdict)}</strong></div></div>
            <div class="kv"><div>适配评分</div><div>${score}/100</div></div>
            ${reasons ? `<ul>${reasons}</ul>` : ''}
          `);
        }

        const keyPoints = (data.report_json && Array.isArray(data.report_json.key_points)) ? data.report_json.key_points : [];
        if (keyPoints.length) {
          blocks.push(`<h4>关键结论</h4><ul>${keyPoints.map(x => `<li>${escHtml(x)}</li>`).join('')}</ul>`);
        }

        if (typeof data.duration_sec === 'number') {
          blocks.push(`
            <div class="kv"><div>时长</div><div>${data.duration_sec.toFixed(2)} 秒</div></div>
            <div class="kv"><div>估计节奏</div><div>${Number(data.bpm || 0).toFixed(1)} BPM</div></div>
            <div class="kv"><div>标签</div><div>${(data.tags || []).map(escHtml).join(' / ')}</div></div>
          `);
        }
        if (Array.isArray(data.scenes) && data.scenes.length) {
          const rows = data.scenes.map(s => `<tr><td>${s.scene_no}</td><td>${escHtml(s.text || '')}</td><td>${escHtml((s.actions || []).join('、') || '无')}</td><td>${escHtml((s.sfx || []).join('、') || '无')}</td><td>${s.intensity ?? ''}</td></tr>`).join('');
          blocks.push(`<h4>文本场景分析</h4><table class="table-lite"><thead><tr><th>场景</th><th>文本</th><th>动作</th><th>建议音效</th><th>强度</th></tr></thead><tbody>${rows}</tbody></table>`);
        }
        if (Array.isArray(data.sfx_requirements) && data.sfx_requirements.length) {
          const rows = data.sfx_requirements.map(r => {
            const cands = (r.candidates || []).map(c => `${c.file_name}(${c.score})`).join('、') || '暂无';
            return `<tr>
              <td>${escHtml(r.term || '')}</td>
              <td>${escHtml((r.scene_nos || []).join('、'))}</td>
              <td>${escHtml(cands)}</td>
              <td>${r.download_ready ? '可下载' : '待补素材'}</td>
            </tr>`;
          }).join('');
          blocks.push(`<h4>音效需求清单（可直接找素材）</h4><table class="table-lite"><thead><tr><th>需求词</th><th>涉及场景</th><th>候选文件</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table>`);
        }
        if (Array.isArray(data.quick_download_list) && data.quick_download_list.length) {
          blocks.push(`<h4>快速下载清单</h4><div>${data.quick_download_list.map(escHtml).join('、')}</div>`);
        }
        if (Array.isArray(data.cues) && data.cues.length) {
          const rows = data.cues.map(c => `<tr>
            <td>${c.scene_no}</td>
            <td>${c.text_start_char ?? '-'} ~ ${c.text_end_char ?? '-'}</td>
            <td>${escHtml(c.text_excerpt || '')}</td>
            <td>${c.narration_start_sec ?? '-'} ~ ${c.narration_end_sec ?? '-'}</td>
            <td>${c.music_segment_start_sec ?? c.target_time_sec} ~ ${c.music_segment_end_sec ?? c.target_time_sec}</td>
            <td>${escHtml(c.marker_label || '')}</td>
            <td>${escHtml(c.dialogue_music_ratio || '')}</td>
            <td>${escHtml((c.recommended_sfx || []).join('、') || '无')}</td>
          </tr>`).join('');
          blocks.push(`<h4>文字-旁白-音乐对位执行单</h4><table class="table-lite"><thead><tr><th>场景</th><th>文字区间</th><th>文字片段</th><th>旁白区间(秒)</th><th>音乐区间(秒)</th><th>锚点</th><th>对白/音乐</th><th>推荐音效</th></tr></thead><tbody>${rows}</tbody></table>`);
        }
        if (data.report_json && Array.isArray(data.report_json.scene_alignment) && data.report_json.scene_alignment.length) {
          const rows = data.report_json.scene_alignment.map(r => `<tr>
            <td>${r.scene_no ?? '-'}</td>
            <td>${r.text_start_char ?? '-'} ~ ${r.text_end_char ?? '-'}</td>
            <td>${escHtml(r.text_excerpt || '')}</td>
            <td>${r.music_start_sec ?? '-'} ~ ${r.music_end_sec ?? '-'}</td>
            <td>${escHtml(r.entry_reason || '')}</td>
            <td>${escHtml(r.dialogue_music_ratio || '')}</td>
            <td>${escHtml((r.sfx || []).join('、') || '无')}</td>
          </tr>`).join('');
          blocks.push(`<h4>文本分析阶段的对位建议</h4><table class="table-lite"><thead><tr><th>场景</th><th>文字区间</th><th>文字片段</th><th>音乐区间(秒)</th><th>进入理由</th><th>对白/音乐</th><th>音效</th></tr></thead><tbody>${rows}</tbody></table>`);
        }
        if (data.report_markdown) {
          blocks.push(`<div class="md">${mdToHtml(data.report_markdown)}</div>`);
        }
        if (!blocks.length) {
          blocks.push(`<div>${escHtml(JSON.stringify(data, null, 2))}</div>`);
        }
        box.innerHTML = blocks.join('');
      }

      function setBusy(busy, label) {
        uiBusy = busy;
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => { btn.disabled = busy; });
        const tip = document.getElementById('busyTip');
        if (busy) {
          tip.style.display = 'block';
          tip.textContent = label ? `处理中：${label}` : '处理中，请稍候...';
        } else {
          tip.style.display = 'none';
          tip.textContent = '处理中，请稍候...';
        }
      }

      async function readApiResponse(res) {
        const text = await res.text();
        let data = text;
        try {
          data = JSON.parse(text);
        } catch (_) {}
        if (!res.ok) {
          const detail = typeof data === 'object' && data ? (data.detail || JSON.stringify(data)) : String(data);
          throw new Error(`HTTP ${res.status}: ${detail}`);
        }
        return data;
      }

      async function runAction(label, fn) {
        if (uiBusy) return show('已有任务在执行，请稍候完成');
        setBusy(true, label);
        show(`正在执行：${label}`);
        try {
          await fn();
        } catch (e) {
          show(`执行失败：${label}\n${e.message || e}`);
        } finally {
          setBusy(false);
        }
      }

      function apiBase() {
        return document.getElementById('apiBase').value.replace(/\/$/, '');
      }

      function reportMode() {
        return document.getElementById('reportMode').value;
      }

      function escHtml(s) {
        return String(s ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function renderDraftReview(data) {
        const tableBox = document.getElementById('draftReviewTable');
        const items = (data && data.draft_items) || [];
        if (!items.length) {
          tableBox.innerHTML = '<div class="hint">暂无候选词。</div>';
          return;
        }
        const rows = items.map((it, idx) => {
          const conf = Number(it.confidence || 0);
          const checked = conf >= 0.45 ? 'checked' : '';
          const lowMatch = (it.sources && it.sources.low_match) || 0;
          const missing = (it.sources && it.sources.missing_sfx) || 0;
          return `
            <tr>
              <td><input type="checkbox" class="draft-item-check" data-idx="${idx}" ${checked} /></td>
              <td>${escHtml(it.candidate)}</td>
              <td>${escHtml(it.target_head)}</td>
              <td>${conf.toFixed(3)}</td>
              <td>low_match=${lowMatch}, missing_sfx=${missing}</td>
              <td>${escHtml(it.review_status || 'pending')}</td>
            </tr>
          `;
        }).join('');
        tableBox.innerHTML = `
          <table class="review-table">
            <thead>
              <tr>
                <th>选择</th><th>候选词</th><th>建议归并头词</th><th>置信度</th><th>来源</th><th>审核状态</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

      function selectAllDraftItems(checked) {
        const checks = document.querySelectorAll('.draft-item-check');
        checks.forEach(ch => { ch.checked = checked; });
      }

      async function createProject() {
        await runAction('创建项目', async () => {
          const title = document.getElementById('projectTitle').value;
          const res = await fetch(`${apiBase()}/projects`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title }),
          });
          const data = await readApiResponse(res);
          projectId = data.id;
          document.getElementById('projectId').textContent = projectId;
          show(data);
        });
      }

      async function uploadAudio() {
        if (!projectId) return show('请先创建项目');
        const f = document.getElementById('audioFile').files[0];
        if (!f) return show('请先选择音频文件');
        await runAction('音乐分析', async () => {
          const form = new FormData();
          form.append('file', f);
          const res = await fetch(`${apiBase()}/analysis/${projectId}/audio?report_mode=${encodeURIComponent(reportMode())}`, { method: 'POST', body: form });
          show(await readApiResponse(res));
        });
      }

      async function analyzeText() {
        if (!projectId) return show('请先创建项目');
        await runAction('文本分析', async () => {
          const text = document.getElementById('textInput').value;
          const res = await fetch(`${apiBase()}/analysis/${projectId}/text`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, report_mode: reportMode() }),
          });
          show(await readApiResponse(res));
        });
      }

      async function analyzeNarration() {
        if (!projectId) return show('请先创建项目');
        const f = document.getElementById('narrationFile').files[0];
        if (!f) return show('请先选择演绎音频');
        await runAction('演绎音频时间轴', async () => {
          const form = new FormData();
          form.append('file', f);
          const res = await fetch(`${apiBase()}/analysis/${projectId}/narration`, { method: 'POST', body: form });
          show(await readApiResponse(res));
        });
      }

      async function buildFusion() {
        if (!projectId) return show('请先创建项目');
        await runAction('生成融合执行单', async () => {
          const pre = await fetch(`${apiBase()}/analysis/${projectId}/report`);
          const report = await readApiResponse(pre);
          if (!report.audio) {
            throw new Error('请先执行第2步：音乐分析');
          }
          if (!report.text) {
            const textVal = (document.getElementById('textInput').value || '').trim();
            if (textVal) {
              const autoText = await fetch(`${apiBase()}/analysis/${projectId}/text`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: textVal, report_mode: reportMode() }),
              });
              await readApiResponse(autoText);
            } else {
              throw new Error('请先执行第3步：文本分析（或先输入文本）');
            }
          }
          const res = await fetch(`${apiBase()}/analysis/${projectId}/fusion?report_mode=${encodeURIComponent(reportMode())}`, { method: 'POST' });
          show(await readApiResponse(res));
        });
      }

      async function fetchReport() {
        if (!projectId) return show('请先创建项目');
        await runAction('拉取完整报告', async () => {
          const res = await fetch(`${apiBase()}/analysis/${projectId}/report`);
          show(await readApiResponse(res));
        });
      }

      async function _download(url, fallbackName) {
        await runAction(`下载 ${fallbackName}`, async () => {
          const res = await fetch(url);
          if (!res.ok) {
            const err = await readApiResponse(res);
            show(err);
            return;
          }
          const blob = await res.blob();
          const a = document.createElement('a');
          const href = URL.createObjectURL(blob);
          a.href = href;
          const cd = res.headers.get('content-disposition') || '';
          const m = cd.match(/filename=\"?([^\";]+)\"?/i);
          a.download = (m && m[1]) || fallbackName;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(href);
          show({ ok: true, downloaded: a.download });
        });
      }

      async function downloadCueCsv() {
        if (!projectId) return show('请先创建项目');
        await _download(`${apiBase()}/analysis/${projectId}/export?type=cue_csv`, `project_${projectId}_cue.csv`);
      }

      async function downloadSfxZip() {
        if (!projectId) return show('请先创建项目');
        await _download(`${apiBase()}/analysis/${projectId}/export?type=sfx_zip`, `project_${projectId}_sfx.zip`);
      }

      async function graphReason() {
        const term = document.getElementById('graphTerm').value.trim();
        if (!term) return show('请输入图谱推理词');
        await runAction('图谱推理', async () => {
          const pidPart = projectId ? `&project_id=${projectId}` : '';
          const res = await fetch(`${apiBase()}/graph/reason?term=${encodeURIComponent(term)}&limit=12&max_hops=2${pidPart}`);
          show(await readApiResponse(res));
        });
      }

      async function graphStatus() {
        await runAction('图谱状态', async () => {
          const res = await fetch(`${apiBase()}/graph/status`);
          show(await readApiResponse(res));
        });
      }

      async function graphDashboard() {
        await runAction('图谱看板', async () => {
          const [healthRes, statusRes, metricsRes] = await Promise.all([
            fetch(`${apiBase().replace(/\/api$/, '')}/health`),
            fetch(`${apiBase()}/graph/status`),
            fetch(`${apiBase()}/graph/metrics?days=7`),
          ]);
          const health = await readApiResponse(healthRes);
          const status = await readApiResponse(statusRes);
          const metrics = await readApiResponse(metricsRes);
          show({ health, status, metrics, current_project_id: projectId });
        });
      }

      async function opsFunnel() {
        await runAction('漏斗指标', async () => {
          const res = await fetch(`${apiBase()}/ops/funnel?days=7`);
          show(await readApiResponse(res));
        });
      }

      async function opsRecommend() {
        await runAction('优化建议', async () => {
          const res = await fetch(`${apiBase()}/ops/recommendations?days=7`);
          show(await readApiResponse(res));
        });
      }

      async function opsLexiconDraft() {
        await runAction('生成词典草稿', async () => {
          const res = await fetch(`${apiBase()}/ops/lexicon-draft?days=7`);
          const data = await readApiResponse(res);
          latestLexiconDraft = data;
          renderDraftReview(data);
          show(data);
        });
      }

      async function opsLexiconDraftApplyMerge() {
        if (!latestLexiconDraft || !latestLexiconDraft.draft_lexicon) {
          return show('请先执行“生成词典草稿”');
        }
        await runAction('应用词典草稿(merge)', async () => {
          const res = await fetch(`${apiBase()}/ops/lexicon-draft/apply`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              draft_lexicon: latestLexiconDraft.draft_lexicon,
              mode: 'merge',
              dry_run: false,
            }),
          });
          show(await readApiResponse(res));
        });
      }

      async function opsLexiconDraftApplyHighConf() {
        if (!latestLexiconDraft || !latestLexiconDraft.draft_items) {
          return show('请先执行“生成词典草稿”');
        }
        await runAction('应用高置信草稿', async () => {
          const res = await fetch(`${apiBase()}/ops/lexicon-draft/apply`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              draft_items: latestLexiconDraft.draft_items,
              min_confidence: 0.45,
              only_selected: false,
              mode: 'merge',
              dry_run: false,
            }),
          });
          show(await readApiResponse(res));
        });
      }

      async function opsLexiconDraftApplyManual() {
        if (!latestLexiconDraft || !latestLexiconDraft.draft_items) {
          return show('请先执行“生成词典草稿”');
        }
        const checks = Array.from(document.querySelectorAll('.draft-item-check'));
        if (!checks.length) return show('审核列表为空，请先生成草稿');
        const selectedIdx = new Set(
          checks.filter(ch => ch.checked).map(ch => Number(ch.dataset.idx))
        );
        const items = (latestLexiconDraft.draft_items || []).map((x, idx) => ({
          ...x,
          selected: selectedIdx.has(idx),
        }));
        if (items.filter(x => x.selected).length === 0) {
          return show('请至少勾选一个候选词');
        }
        await runAction('按勾选候选应用', async () => {
          const res = await fetch(`${apiBase()}/ops/lexicon-draft/apply`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              draft_items: items,
              min_confidence: 0,
              only_selected: true,
              mode: 'merge',
              dry_run: false,
            }),
          });
          show(await readApiResponse(res));
        });
      }

      function _buildSelectedReviewItems(status) {
        const checks = Array.from(document.querySelectorAll('.draft-item-check'));
        const selectedIdx = new Set(checks.filter(ch => ch.checked).map(ch => Number(ch.dataset.idx)));
        const src = latestLexiconDraft?.draft_items || [];
        const items = src
          .filter((x, idx) => selectedIdx.has(idx))
          .map(x => ({
            candidate: x.candidate,
            target_head: x.target_head,
            status,
            note: status === 'rejected' ? 'manual_reject' : 'manual_approve',
          }));
        return items;
      }

      async function markSelectedDraftRejected() {
        if (!latestLexiconDraft || !latestLexiconDraft.draft_items) return show('请先生成词典草稿');
        const items = _buildSelectedReviewItems('rejected');
        if (!items.length) return show('请至少勾选一个候选词');
        await runAction('标记候选为拒绝', async () => {
          const res = await fetch(`${apiBase()}/ops/lexicon-review`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items }),
          });
          show(await readApiResponse(res));
        });
      }

      async function markSelectedDraftApproved() {
        if (!latestLexiconDraft || !latestLexiconDraft.draft_items) return show('请先生成词典草稿');
        const items = _buildSelectedReviewItems('approved');
        if (!items.length) return show('请至少勾选一个候选词');
        await runAction('标记候选为通过', async () => {
          const res = await fetch(`${apiBase()}/ops/lexicon-review`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items }),
          });
          show(await readApiResponse(res));
        });
      }
    </script>
  </body>
</html>
